[project]
name = "poe2craft"
version = "0.1.0"
description = "Solves Path of Exile 2 item crafting as an MDP: learns a transition model and computes the optimal action policy toward a target item spec."
readme = "README.md"
authors = [
    { email = "chris.ak.walker@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "lxml>=6.1.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
poe2craft = "poe2craft.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
